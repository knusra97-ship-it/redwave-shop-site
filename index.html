<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Redwave — groceries to your door in 15–30 minutes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#FF2A3B;        /* swap here to change the single accent */
  --crimson-deep:#B80F1F;
  --onyx:#0F172A;
  --slate:#64748B;
  --canvas:#FFFFFF;
  --s1:#F7F9FB;
  --s2:#F1F5F9;
  --line:#E2E8F0;
  --emerald:#10B981;
  --emerald-ink:#047857;
  --emerald-bg:#ECFDF5;
  --coral:#FF6B6B;
  --r-card:16px; --r-btn:12px;
  --hdr:132px;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--onyx);font-weight:500;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:2px solid var(--onyx);outline-offset:2px}
.btn-red:focus-visible,.pill-cart:focus-visible{outline:2px solid var(--onyx);outline-offset:3px;box-shadow:0 0 0 5px #fff}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.02em;line-height:1.1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--slate)}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1440px;margin:0 auto;padding:12px 24px;display:grid;grid-template-columns:auto auto minmax(220px,1fr) auto auto;grid-template-areas:"logo loc search streak cart";gap:16px;align-items:center}
.logo{grid-area:logo;display:flex;align-items:center;gap:8px;font-size:24px;font-weight:700;letter-spacing:-0.03em;text-decoration:none}
.loc-wrap{grid-area:loc;position:relative;display:flex;align-items:center;gap:12px}
.chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.chip:hover{background:var(--s1)}
.status{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--slate);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:999px;background:var(--emerald);flex:none}
.pop{position:absolute;top:52px;left:0;min-width:260px;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:0 12px 32px rgba(15,23,42,.12);padding:8px;z-index:40}
.pop button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;font-weight:700;font-size:14px;text-align:left}
.pop button:hover,.pop button[aria-selected=true]{background:var(--s2)}
.pop small{font-weight:600;color:var(--slate);font-size:12px}
.search{grid-area:search;position:relative;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:var(--r-card);background:var(--s1);border:1px solid var(--line)}
.search:focus-within{background:#fff;border-color:var(--onyx);box-shadow:0 0 0 1px var(--onyx)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15px;font-weight:600}
.search input::placeholder{color:var(--slate);font-weight:500}
.icobtn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icobtn:hover{background:var(--s2)}
kbd{font:inherit;font-size:11px;font-weight:700;color:var(--slate);border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 6px}
.streak{grid-area:streak;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.hdr-right{grid-area:cart;display:flex;gap:8px;align-items:center}
.cartbtn{display:none;position:relative;height:44px;padding:0 16px;border-radius:var(--r-btn);background:var(--onyx);color:#fff;font-weight:700;font-size:14px;align-items:center;gap:8px}
.trkbtn{display:none;height:44px;padding:0 14px;border-radius:var(--r-btn);border:1.5px solid var(--onyx);font-weight:700;font-size:13px;align-items:center;gap:8px;white-space:nowrap}
.trkbtn.on{display:inline-flex}

/* shell */
.shell{max-width:1440px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:32px;align-items:start}
.cartside{position:sticky;top:calc(var(--hdr) - 8px);max-height:calc(100vh - var(--hdr) - 8px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-card);background:#fff;overflow:hidden}
main{min-width:0}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.drop{position:relative;overflow:hidden;background:var(--onyx);color:#fff;border-radius:var(--r-card);padding:32px;display:flex;flex-direction:column;gap:18px;min-height:340px}
.drop svg.deco{position:absolute;right:-90px;top:-90px;pointer-events:none}
.drop .k{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--crimson)}
.drop h1{font-size:clamp(30px,4.2vw,50px);max-width:12ch;position:relative}
.timer{display:flex;align-items:center;gap:8px;position:relative}
.timer .lbl{font-size:13px;font-weight:600;color:#CBD5E1;margin-right:4px}
.timer b{min-width:46px;text-align:center;padding:8px 10px;border-radius:10px;background:#1E293B;font-size:20px;font-variant-numeric:tabular-nums}
.timer i{font-style:normal;font-weight:700;color:#CBD5E1}
.cold{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:28px;display:flex;flex-direction:column;gap:16px;justify-content:space-between}
.cold h2{font-size:26px}
.cold p{margin:0;color:var(--slate);font-size:14px}
.tempgrid{display:flex;flex-direction:column;gap:8px}
.temp{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px}
.temp .dot{box-shadow:0 0 0 4px var(--emerald-bg)}

/* rings */
.rings{display:flex;gap:22px;overflow-x:auto;padding:28px 2px 8px;scrollbar-width:none}
.rings::-webkit-scrollbar{display:none}
.ringbtn{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;text-align:center}
.ring{width:72px;height:72px;border-radius:999px;padding:3px;background:linear-gradient(135deg,var(--crimson),var(--crimson-deep));display:grid;place-items:center}
.ring.seen{background:var(--line)}
.ring .w{width:100%;height:100%;border-radius:999px;background:#fff;padding:3px}
.ring .n{width:100%;height:100%;border-radius:999px;background:var(--s2);display:grid;place-items:center}
.ringbtn[aria-pressed=true] .n{background:var(--onyx)}
.ringbtn[aria-pressed=true] .n svg{stroke:#fff}

/* section head + pills */
.sec{margin-top:20px}
.sec-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h h2{font-size:26px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pillf{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px}
.pillf:hover{background:var(--s1)}
.pillf[aria-pressed=true]{background:var(--onyx);border-color:var(--onyx);color:#fff}
.pillf svg{display:none}
.pillf[aria-pressed=true] svg{display:block}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:var(--r-card);padding:10px;display:flex;flex-direction:column;gap:10px;background:#fff}
.card.out .imgbtn svg{opacity:.45}
.imgbtn{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:12px;background:var(--s1);overflow:hidden}
.imgbtn svg{width:100%;height:100%;display:block}
.imgbtn:hover{background:var(--s2)}
.tag{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;line-height:1.2}
.tag.em{background:var(--emerald-bg);color:var(--emerald-ink)}
.tag.em::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--emerald)}
.tag.fl{background:var(--coral);color:var(--onyx);top:auto;bottom:8px}
.tag.pd{left:auto;right:8px;background:var(--crimson);color:#fff}
.cname{font-size:14px;font-weight:700;line-height:1.25;text-align:left;min-height:35px}
.cname:hover{text-decoration:underline}
.csize{font-size:12px;color:var(--slate);font-weight:600}
.price{display:flex;align-items:baseline;gap:8px;font-size:16px;font-weight:700;letter-spacing:-0.01em}
.price s{font-size:12px;color:var(--slate);font-weight:600}
.stk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;min-height:18px}
.stk .dot.low{background:var(--coral)} .stk .dot.none{background:#CBD5E1}
.stk.low{font-weight:800}
.acts{display:flex;gap:8px;margin-top:auto}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;height:44px;padding:0 12px;border-radius:var(--r-btn);font-size:13px;font-weight:700;white-space:nowrap}
.btn-out{border:1.5px solid var(--onyx);background:#fff}
.btn-out:hover{background:var(--onyx);color:#fff}
.btn-red{background:var(--crimson);color:#fff}
.btn-red:hover{background:var(--crimson-deep)}
.btn-dark{background:var(--onyx);color:#fff}
.btn:disabled{opacity:.4;background:var(--s2);border:1.5px solid var(--line);color:var(--slate)}
.btn:disabled:hover{background:var(--s2);color:var(--slate)}

/* result rows */
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px}
.row{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.row .imgbtn{width:96px;flex:none}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .acts{margin-top:8px;justify-content:space-between;align-items:center}
.row .acts .btn{flex:none}
.sugg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.sugg .sp{font-size:13px;font-weight:600;color:var(--slate);margin-right:4px}
.sugg button{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--s2);font-weight:700;font-size:13px}
.empty{padding:40px;border:1px dashed var(--line);border-radius:var(--r-card);text-align:center;color:var(--slate)}

/* cart panel */
.ch{padding:20px 20px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.ch h2{font-size:22px}
.ch .sub{font-size:12px;color:var(--slate);font-weight:600;margin-top:4px}
.cb{flex:1;overflow:auto;padding:0 20px}
.free{margin:16px 0 4px;padding:14px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.free p{margin:0 0 10px;font-size:13px;font-weight:700}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--onyx);border-radius:999px;transition:width .3s}
.slot{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;color:var(--slate)}
.slot b{color:var(--onyx);font-variant-numeric:tabular-nums}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .th{width:60px;height:60px;border-radius:12px;background:var(--s1);flex:none}
.line .th svg{width:100%;height:100%}
.line .mid{flex:1;min-width:0}
.line .mid b{display:block;font-size:13px;line-height:1.25}
.line .mid span{font-size:12px;color:var(--slate);font-weight:600}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--s2);border-radius:12px;height:44px;flex:none}
.step button{width:36px;height:44px;display:grid;place-items:center;font-weight:800}
.step output{min-width:22px;text-align:center;font-weight:700;font-size:14px}
.cf{padding:16px 20px 20px;border-top:1px solid var(--line);background:#fff}
.sum{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;font-size:14px}
.sum div{display:flex;justify-content:space-between}
.sum .lb{color:var(--slate);font-weight:600}
.sum .tot{padding-top:10px;border-top:1px solid var(--line);align-items:baseline}
.sum .tot b{font-size:22px;letter-spacing:-0.02em}
.cf .btn{width:100%;height:52px;font-size:15px}
.cempty{padding:40px 0;text-align:center;color:var(--slate)}
.cempty b{display:block;color:var(--onyx);font-size:16px;margin-bottom:6px}

/* drawer + dialogs */
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.on{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(15,23,42,.2);animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
dialog{border:0;padding:0;border-radius:var(--r-card);box-shadow:0 24px 60px rgba(15,23,42,.28);max-width:calc(100% - 32px);color:var(--onyx);background:#fff}
dialog::backdrop{background:rgba(15,23,42,.5)}
.dprod{width:920px}
.dpay{width:520px}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:20px}
.prodgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pimg{background:var(--s1);display:grid;place-items:center;padding:32px;position:relative;min-height:360px}
.pimg svg{width:min(320px,100%);height:auto}
.pinfo{padding:28px;display:flex;flex-direction:column;gap:10px}
.pinfo .brand{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--slate)}
.pinfo h2{font-size:30px}
.pinfo .big{font-size:30px;font-weight:700;letter-spacing:-0.02em}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:12px;font-weight:700}
.badge.em{background:var(--emerald-bg);border-color:#A7F3D0;color:var(--emerald-ink)}
.cc{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:13px}
.cc b{display:block;font-size:14px}
.pbuy{display:flex;gap:8px;margin-top:6px;align-items:center}
.fbw{padding:20px 28px 28px;border-top:1px solid var(--line)}
.fbw h3{font-size:18px;margin-bottom:12px}
.fbrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.mini{flex:none;width:148px;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.mini .imgbtn{border-radius:10px}
.mini b{font-size:12px;line-height:1.25;min-height:30px}
.mini .btn{width:100%;flex:none}
.paybody{padding:20px;display:flex;flex-direction:column;gap:16px}
.sumitems{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--slate)}
.sumitems div{display:flex;justify-content:space-between;gap:12px}
.paylist{display:flex;flex-direction:column;gap:8px;border:0;padding:0;margin:0}
.paylist legend{font-weight:700;font-size:15px;margin-bottom:10px;padding:0}
.payopt{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:0 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.payopt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.payopt .mk{width:38px;height:38px;border-radius:8px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.payopt .tx{flex:1;display:flex;flex-direction:column;font-size:14px;font-weight:700;line-height:1.25}
.payopt .tx small{font-size:12px;color:var(--slate);font-weight:500}
.payopt .rad{width:22px;height:22px;border-radius:999px;border:2px solid #CBD5E1;display:grid;place-items:center;flex:none}
.payopt:has(input:checked){border:1.5px solid var(--onyx);background:var(--s1)}
.payopt:has(input:checked) .mk{background:var(--onyx);color:#fff;border-color:var(--onyx)}
.payopt:has(input:checked) .rad{border-color:var(--onyx)}
.payopt:has(input:checked) .rad::after{content:"";width:10px;height:10px;border-radius:999px;background:var(--onyx)}
.payopt:has(input:focus-visible){outline:2px solid var(--onyx);outline-offset:2px}
.slide{position:relative;height:60px;border-radius:var(--r-btn);background:var(--crimson);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;user-select:none;box-shadow:0 6px 18px rgba(255,42,59,.25)}
.slide span{padding-left:48px}
.knob{position:absolute;left:4px;top:4px;width:52px;height:52px;border-radius:10px;background:#fff;display:grid;place-items:center;touch-action:none;cursor:grab}
.knob:focus-visible{outline:2px solid var(--onyx);outline-offset:2px}
.hint{font-size:12px;color:var(--slate);text-align:center;margin-top:-6px}

/* tracking */
.trk{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.map{position:relative;border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line);background:var(--s2);height:560px}
.map svg{width:100%;height:100%;display:block}
.mapchip{position:absolute;left:16px;top:16px;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700}
.tinfo{display:flex;flex-direction:column;gap:20px}
.tinfo h1{font-size:clamp(30px,3.4vw,42px)}
.coldchip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;background:var(--emerald-bg);border:1px solid #A7F3D0;color:var(--emerald-ink);font-size:13px;font-weight:800}
.steps{display:flex;list-style:none;margin:0;padding:0}
.steps li{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;text-align:center}
.steps li::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:3px;background:var(--line)}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.cur::before{background:var(--onyx)}
.steps .nd{position:relative;z-index:1;width:28px;height:28px;border-radius:999px;border:3px solid #CBD5E1;background:#fff;display:grid;place-items:center}
.steps .done .nd{background:var(--onyx);border-color:var(--onyx)}
.steps .cur .nd{border-color:var(--onyx)}
.steps .cur .nd::after{content:"";width:10px;height:10px;border-radius:999px;background:var(--onyx)}
.steps .todo{color:var(--slate)}
.steps small{font-size:11px;color:var(--slate);font-weight:600}
.rider{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-card);background:var(--s1);border:1px solid var(--line)}
.av{width:48px;height:48px;border-radius:999px;background:var(--onyx);color:#fff;display:grid;place-items:center;font-weight:700}
.rider .nm{flex:1;display:flex;flex-direction:column;font-weight:700}
.rider .nm small{font-size:12px;color:var(--slate);font-weight:600}
.sqb{width:48px;height:48px;border-radius:12px;display:grid;place-items:center}
.demo{font-size:12px;color:var(--slate)}

/* reorder */
.back{display:inline-flex;align-items:center;gap:6px;height:44px;font-weight:700;font-size:14px;margin-left:-4px}

/* mobile chrome */
.tabs{display:none}
.pill-cart{display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--onyx);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- search (typo tolerant) ---------- */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1))}prev=cur}return prev[n]}
const thr=w=>w.length<=3?0:(w.length<=5?1:2);
const words=p=>norm(p.n+' '+p.b+' '+p.kw).split(' ');
const VOCAB=[...new Set(P.flatMap(words))];
function wscore(t,w){if(w.includes(t))return w.startsWith(t)?3:2;const k=thr(t);if(!k)return 0;const d=Math.min(lev(t,w),lev(t,w.slice(0,t.length+1)));return d<=k?1:0}
function doSearch(q){const toks=norm(q).split(' ').filter(Boolean);if(!toks.length)return{list:[],fixed:''};
 const res=[];P.forEach(p=>{const ws=words(p);let tot=0;for(const t of toks){let best=0;for(const w of ws){const s=wscore(t,w);if(s>best)best=s}if(!best){tot=0;break}tot+=best}if(tot)res.push([tot,p])});
 res.sort((a,b)=>b[0]-a[0]);
 const fixed=toks.map(t=>{if(VOCAB.some(w=>w.includes(t)))return t;let best=t,bd=9;const k=thr(t);if(!k)return t;for(const w of VOCAB){const d=lev(t,w);if(d<bd&&d<=k){bd=d;best=w}}return best}).join(' ');
 return{list:res.map(r=>r[1]),fixed:fixed!==toks.join(' ')?fixed:''}}

/* ---------- filters ---------- */
function applyFilters(list){return list.filter(p=>{if(S.f.u50&&p.pr>=50)return false;if(S.f.stock&&stock(p)===0)return false;if(S.f.chill&&!(p.chill||p.frozen))return false;if(S.f.vegan&&!p.vegan)return false;return true})}
function pills(){const defs=[['u50','Under MVR 50'],['stock','In stock nearby'],['chill','Chilled'],['vegan','Vegan']];
 return `<div class="pills" role="group" aria-label="Filters">${defs.map(([k,l])=>`<button class="pillf" data-a="filter" data-k="${k}" aria-pressed="${S.f[k]}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>${l}</button>`).join('')}</div>`}

function tagHTML(p){let t='';if(p.frozen)t+=`<span class="tag em">−18°C Chilled</span>`;else if(p.chill)t+=`<span class="tag em">Chilled</span>`;else if(p.tags.includes('fresh'))t+=`<span class="tag em">Island Fresh</span>`;
 if(p.old)t+=`<span class="tag pd">−${Math.round((1-p.pr/p.old)*100)}%</span>`;if(p.flash)t+=`<span class="tag fl">Flash deal</span>`;return t}
function stockHTML(p){const s=stock(p),h=hub().short;if(s===0){const alt=P&&HUBS.map((x,i)=>({x,i})).find(o=>o.i!==S.hub&&p.st[o.i]>0);return `<div class="stk"><span class="dot none"></span><span class="muted">Not at ${h}${alt?` · at ${alt.x.short}`:''}</span></div>`}
 if(s<=5)return `<div class="stk low"><span class="dot low"></span>Only ${s} left at ${h}</div>`;return `<div class="stk"><span class="dot"></span>In stock · ${s} at ${h}</div>`}
function priceHTML(p){return `<div class="price">${money(p.pr)}${p.old?`<s>${p.old.toFixed(2)}</s>`:''}</div>`}
function actsHTML(p){const o=stock(p)===0;return `<div class="acts"><button class="btn btn-out" data-a="add" data-id="${p.id}"${o?' disabled':''} aria-label="Add ${p.n} to cart">+ Add</button><button class="btn btn-red" data-a="tap" data-id="${p.id}"${o?' disabled':''} aria-label="1-Tap buy ${p.n}">${bolt}1-Tap</button></div>`}
function cardHTML(p){return `<article class="card${stock(p)===0?' out':''}"><button class="imgbtn" data-a="open" data-id="${p.id}" aria-label="View ${p.n}">${svg(p)}${tagHTML(p)}</button><button class="cname" data-a="open" data-id="${p.id}">${p.n}</button><div class="csize">${p.sz}</div>${priceHTML(p)}${stockHTML(p)}${actsHTML(p)}</article>`}
function rowHTML(p){const o=stock(p)===0;return `<article class="row"><button class="imgbtn" data-a="open" data-id="${p.id}" aria-label="View ${p.n}">${svg(p)}</button><div class="mid"><button class="cname" style="min-height:0" data-a="open" data-id="${p.id}">${p.n}</button><div class="csize">${p.sz}</div>${stockHTML(p)}<div class="acts">${priceHTML(p)}<div style="display:flex;gap:8px"><button class="btn btn-out" style="width:44px;padding:0" data-a="add" data-id="${p.id}"${o?' disabled':''} aria-label="Add ${p.n} to cart"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button class="btn btn-red" data-a="tap" data-id="${p.id}"${o?' disabled':''} aria-label="1-Tap buy ${p.n}">${bolt}1-Tap</button></div></div></div></article>`}

const STAGES=['Packed','Picked up','On the way','Arrived'];
const T_AT=[0,4,8,34]; // seconds when each stage becomes current
function trackTick(){const o=S.order;if(!o)return;const t=(Date.now()-o.t0)/1000;
 let cur=0;T_AT.forEach((s,i)=>{if(t>=s)cur=i});const delivered=t>=T_AT[3]+2;
 if(cur>o.stage){for(let i=o.stage+1;i<=cur;i++)o.times[i]=new Date()}o.stage=cur;
 const p=Math.max(0,Math.min(1,(t-8)/(34-8)));const eta=delivered?0:Math.max(1,Math.ceil(o.eta*(1-Math.min(1,t/36))));
 if(delivered&&!o.done){o.done=true;S.streak=7;updateStreak();updateTrkBtn();toast('Delivered. Enjoy your order.')}
 if(S.view!=='track')return;
 const r=$('#rtDone'),rd=$('#rider');if(!r||!rd)return;
 const L=r.getTotalLength();r.style.strokeDasharray=L;r.style.strokeDashoffset=L*(1-p);const pt=r.getPointAtLength(L*p);rd.setAttribute('transform',`translate(${pt.x} ${pt.y})`);
 $('#tH').textContent=delivered?'Delivered':(cur>=3?'Arriving now':`Arriving in ${eta} min`);
 $('#tS').textContent=`${o.count} item${o.count===1?'':'s'} · ${money(o.total)} · ${hub().name}`;
 const fmt=d=>d?d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
 $('#tSteps').innerHTML=STAGES.map((s,i)=>{const done=i<cur||(i===3&&delivered);const isCur=i===cur&&!done;const cls=done?'done':isCur?'cur':'todo';
  const sub=done?fmt(o.times[i]):(isCur?'Now':'');return `<li class="${cls}"${isCur?' aria-current="step"':''}><span class="nd">${done?check:''}</span>${s}<small>${sub||'&nbsp;'}</small></li>`}).join('');
 $('#tCold').innerHTML=o.frozen?`<span class="coldchip">${snow}−18°C maintained</span>`:(o.chill?`<span class="coldchip">${snow}Island Cold-Chain maintained</span>`:'');
 $('#tDone').innerHTML=delivered?`<button class="btn btn-dark" style="width:100%;height:52px" data-a="home">Back to shop</button>`:'';
 const dm=$('#tDemo');if(dm&&delivered)dm.style.display='none'}
setInterval(trackTick,300);

 const cc=(p.frozen||p.chill)?`<div class="cc"><span style="width:40px;height:40px;border-radius:999px;background:var(--emerald-bg);display:grid;place-items:center;flex:none">${snow}</span><div><b>${p.frozen?'−18°C Chilled Express':'Island Cold-Chain'}</b><span class="muted">Insulated bag, temperature checked at handover.</span></div></div>`:'';
 return `<div class="dhead"><span style="font-weight:700;font-size:14px" class="muted">${p.b}</span><button class="icobtn" data-a="closeDlg" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="prodgrid"><div class="pimg">${svg(p)}${(p.frozen||p.chill)?`<span class="tag em" style="left:16px;top:auto;bottom:16px">${snow}Island Cold-Chain</span>`:(p.tags.includes('fresh')?'<span class="tag em" style="left:16px;top:auto;bottom:16px">Island Fresh</span>':'')}</div>
 <div class="pinfo"><h2>${p.n}</h2><div class="muted" style="font-weight:600">${p.sz}${p.vegan?' · Vegan':''}${p.frozen?' · Frozen':p.chill?' · Chilled':''}</div>
 <div class="price" style="font-size:30px;margin-top:4px"><span>${money(p.pr)}</span>${p.old?`<s style="font-size:14px">${p.old.toFixed(2)}</s>`:''}</div>
 <div class="badges">${p.vegan?'<span class="badge">Vegan</span>':''}<span class="badge">${s===0?'Not at '+hub().short:(s<=5?'Only '+s+' left at '+hub().short:'In stock at '+hub().short)}</span></div>
 <p style="margin:6px 0 0;line-height:1.55">${p.d}</p>${cc}
 <div class="pbuy"><div class="step"><button data-a="pdec" aria-label="Decrease quantity">−</button><output id="pq">${S.pq}</output><button data-a="pinc" aria-label="Increase quantity">+</button></div><button class="btn btn-out" style="height:48px" data-a="padd"${s===0?' disabled':''}>Add to cart</button><button class="btn btn-red" style="height:48px" data-a="pbuy"${s===0?' disabled':''}>${bolt}Buy now</button></div></div></div>
 <div class="fbw"><h3>Frequently bought with</h3><div class="fbrow">${fb.map(f=>`<div class="mini"><button class="imgbtn" data-a="open" data-id="${f.id}" aria-label="View ${f.n}">${svg(f)}</button><b>${f.n}</b><span style="font-weight:700;font-size:13px">${money(f.pr)}</span><button class="btn btn-out" data-a="add" data-id="${f.id}"${stock(f)===0?' disabled':''} aria-label="Add ${f.n} to cart">+ Add</button></div>`).join('')}</div></div>`}
function payDialog(){const x=S.ctx;const c=calc(x.items);
 return `<div class="dhead"><h2>${x.src==='tap'?'1-Tap checkout':'Checkout'}</h2><button class="icobtn" data-a="closeDlg" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="paybody"><div class="sumitems"><div style="color:var(--onyx);font-weight:700"><span>Delivering to ${hub().name}</span><span>${hub().eta} min</span></div>${x.items.map(i=>`<div><span>${i.q} × ${BYID[i.id].n}</span><span>${money(BYID[i.id].pr*i.q)}</span></div>`).join('')}</div>
 <div class="sum" style="margin:0"><div><span class="lb">Subtotal</span><b>${money(c.sub)}</b></div><div><span class="lb">GST (8%)</span><b>${money(c.gst)}</b></div><div><span class="lb">Express delivery</span><b>${c.del?money(c.del):'Free'}</b></div><div class="tot"><b>Total</b><b>${money(c.total)}</b></div></div>
 <fieldset class="paylist"><legend>Pay with</legend>${PAYS.map(p=>`<label class="payopt"><input type="radio" name="pay" value="${p.k}"${S.pay===p.k?' checked':''}><span class="mk">${p.mk}</span><span class="tx">${p.n}<small>${p.s}</small></span><span class="rad"></span></label>`).join('')}</fieldset>
 <div class="slide" id="slide" data-p="0"><button class="knob" id="knob" aria-label="Slide to pay ${money(c.total)}. Or press Enter to confirm."><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF2A3B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><span>Slide to pay · MVR ${Math.round(c.total)}</span></div>
 <div class="hint">Payments in this demo are simulated.</div></div>`}
function setupSlider(){const tr=$('#slide'),kn=$('#knob');if(!tr||!kn)return;let drag=false,x0=0,max=0;
 kn.addEventListener('pointerdown',e=>{drag=true;x0=e.clientX;max=tr.clientWidth-kn.offsetWidth-8;kn.setPointerCapture(e.pointerId);kn.style.transition='none'});
 kn.addEventListener('pointermove',e=>{if(!drag)return;const dx=Math.max(0,Math.min(max,e.clientX-x0));kn.style.transform=`translateX(${dx}px)`;tr.dataset.p=String(dx/max)});
 const end=()=>{if(!drag)return;drag=false;kn.style.transition='transform .2s';if(+tr.dataset.p>0.88){kn.style.transform=`translateX(${max}px)`;complete()}else{kn.style.transform='';tr.dataset.p='0'}};
 kn.addEventListener('pointerup',end);kn.addEventListener('pointercancel',end);
 kn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();complete()}})}
let completing=false;
function complete(){if(completing||!S.ctx)return;completing=true;
 const x=S.ctx,c=calc(x.items);const items=x.items.map(i=>({...i}));
 S.order={id:'RW-'+(4822+Math.floor(Math.random()*90)),items,total:c.total,count:items.reduce((a,i)=>a+i.q,0),t0:Date.now(),stage:0,times:[new Date()],done:false,eta:hub().eta,frozen:items.some(i=>BYID[i.id].frozen),chill:items.some(i=>BYID[i.id].chill||BYID[i.id].frozen)};
 S.last=items.map(i=>i.id);
 if(x.src==='cart'){S.cart={};}
 save();S.ctx=null;
 setTimeout(()=>{$('#dlgPay').close();completing=false;closeDrawer();S.view='track';render();window.scrollTo({top:0});toast('Payment confirmed. Packing your order.')},350)}

/* ---------- render ---------- */
function render(){
 const m=$('#main');
 m.innerHTML=S.view==='home'?homeView():S.view==='search'?searchView():S.view==='reorder'?reorderView():trackView();
 if(S.view==='track')trackTick();
 renderCart();renderChrome();
}
function renderCart(){const side=$('#cartSide');if(side)side.innerHTML=cartHTML(false);const dp=$('#drawerPanel');if(dp)dp.innerHTML=cartHTML(true)}
function renderChrome(){
 const h=hub(),n=cartCount(),c=calc(cartItems());
 $('#locName').textContent=h.name;$('#locStatus').textContent=`Dark store open · ${h.eta} min`;
 $('#cartN').textContent=n;
 const pill=$('#pill');pill.classList.toggle('on',n>0&&S.view!=='track');$('#pillTxt').textContent=`View cart · ${n} item${n===1?'':'s'} · ${money(c.sub).replace('.00','')}`;
 const bd=$('#tabBd');bd.hidden=n===0;bd.textContent=n;
 ['Home','Explore','Reorder'].forEach(k=>{const b=$('#tab'+k);b.removeAttribute('aria-current')});
 const cur=S.view==='reorder'?'Reorder':(S.view==='search'?'Explore':(S.view==='home'?'Home':null));if(cur)$('#tab'+cur).setAttribute('aria-current','page');
 updateTrkBtn();updateStreak();
 $('#clearQ').hidden=!S.q;
}
function updateStreak(){$('#streakTxt').textContent=S.streak+'-day streak'}
function updateTrkBtn(){const b=$('#trkBtn'),o=S.order;const on=!!o&&S.view!=='track';b.classList.toggle('on',on);if(on)$('#trkTxt').textContent=o.done?'Order delivered':'Track order '+o.id}
function openDrawer(){renderCart();$('#drawer').classList.add('on');const c=$('#drawerPanel button');if(c)c.focus()}
function closeDrawer(){$('#drawer').classList.remove('on')}

/* ---------- cart ops ---------- */
function addToCart(id,q){const p=BYID[id],s=stock(p);if(s===0){toast('Not available at '+hub().short);return false}
 const cur=S.cart[id]||0;const next=Math.min(cur+q,s,20);if(next===cur){toast('That is all we have at '+hub().short);return false}
 if(!cartCount()){S.slot=300}S.cart[id]=next;save();return true}
function setQty(id,q){if(q<=0)delete S.cart[id];else S.cart[id]=Math.min(q,stock(BYID[id]),20);save()}
function openPay(items,src){S.ctx={items,src};const d=$('#dlgPay');d.innerHTML=payDialog();if(!d.open)d.showModal();setupSlider()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const pop=$('#locPop');if(!pop.hidden&&!e.target.closest('.loc-wrap')){pop.hidden=true;$('#locBtn').setAttribute('aria-expanded','false')}
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=+el.dataset.id;
 if(a==='home'||a==='explore'){e.preventDefault()}
 switch(a){
  case 'home':S.view='home';S.q='';$('#q').value='';S.cat=null;closeDrawer();render();window.scrollTo({top:0,behavior:'smooth'});break;
  case 'explore':S.view='home';S.q='';$('#q').value='';render();window.scrollTo({top:0});$('#q').focus();break;
  case 'reorder':S.view='reorder';closeDrawer();render();window.scrollTo({top:0});break;
  case 'track':S.view='track';render();window.scrollTo({top:0});break;
  case 'locToggle':{const open=pop.hidden;pop.hidden=!open;el.setAttribute('aria-expanded',String(open));if(open){pop.innerHTML=HUBS.map((h,i)=>`<button role="option" aria-selected="${i===S.hub}" data-a="hub" data-i="${i}"><span>${h.name}</span><small>${h.eta} min</small></button>`).join('');pop.querySelector('[aria-selected=true]').focus()}break}
  case 'hub':{S.hub=+el.dataset.i;pop.hidden=true;$('#locBtn').setAttribute('aria-expanded','false');for(const k in S.cart){const s=BYID[k].st[S.hub];if(s===0)delete S.cart[k];else if(S.cart[k]>s)S.cart[k]=s}save();render();toast(`Stock and ETA updated for ${hub().name}`);break}
  case 'clearQ':S.q='';$('#q').value='';S.view='home';render();$('#q').focus();break;
  case 'voice':toast('Voice search needs microphone access in the live app');break;
  case 'scan':toast('Barcode scanning needs camera access in the live app');break;
  case 'cat':{const k=el.dataset.k;S.seen[k]=true;S.cat=(S.cat===k&&!el.dataset.scroll)?null:k;if(S.view!=='home'){S.view='home';S.q='';$('#q').value=''}closeDrawer();render();$('#grid').scrollIntoView({behavior:'smooth',block:'start'});break}
  case 'filter':S.f[el.dataset.k]=!S.f[el.dataset.k];render();break;
  case 'suggest':S.q=el.dataset.v;$('#q').value=S.q;S.view='search';render();break;
  case 'add':if(addToCart(id,1)){render();toast(BYID[id].n+' added')}break;
  case 'tap':if(stock(BYID[id])>0)openPay([{id,q:1}],'tap');break;
  case 'addAll':{const ids=(S.last&&S.last.length)?S.last:[1,5,6];let ok=0;ids.forEach(i=>{if(addToCart(i,1))ok++});render();if(ok)openDrawerOrToast();break}
  case 'inc':setQty(id,(S.cart[id]||0)+1);render();break;
  case 'dec':setQty(id,(S.cart[id]||0)-1);render();break;
  case 'cartOpen':e.preventDefault();openDrawer();break;
  case 'cartClose':closeDrawer();break;
  case 'checkout':if(cartCount()){closeDrawer();openPay(cartItems(),'cart')}break;
  case 'open':S.prodId=id;S.pq=1;{const d=$('#dlgProd');d.innerHTML=prodDialog();if(!d.open)d.showModal();d.scrollTop=0}break;
  case 'pinc':{const s=Math.max(1,Math.min(20,stock(BYID[S.prodId])));S.pq=Math.min(S.pq+1,s);$('#pq').textContent=S.pq;break}
  case 'pdec':S.pq=Math.max(1,S.pq-1);$('#pq').textContent=S.pq;break;
  case 'padd':if(addToCart(S.prodId,S.pq)){$('#dlgProd').close();render();toast(`${S.pq} × ${BYID[S.prodId].n} added`)}break;
  case 'pbuy':$('#dlgProd').close();openPay([{id:S.prodId,q:S.pq}],'tap');break;
  case 'closeDlg':{const d=el.closest('dialog');if(d)d.close();break}
  case 'call':toast('Calling Ahmed M. in the live app');break;
  case 'chat':toast('Chat with Ahmed M. opens in the live app');break;
 }
});
function openDrawerOrToast(){if(matchMedia('(max-width:1100px)').matches)openDrawer();else toast('Added to your cart')}
document.addEventListener('change',e=>{if(e.target.name==='pay'){S.pay=e.target.value}});
['dlgProd','dlgPay'].forEach(id=>{const d=document.getElementById(id);d.addEventListener('click',e=>{if(e.target===d)d.close()});d.addEventListener('close',()=>{if(id==='dlgPay'&&!completing)S.ctx=null})});
$('#q').addEventListener('input',e=>{S.q=e.target.value;S.view=S.q.trim()?'search':'home';render()});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus();$('#q').select()}
 if(e.key==='Escape'){const pop=$('#locPop');if(!pop.hidden){pop.hidden=true;$('#locBtn').setAttribute('aria-expanded','false');$('#locBtn').focus()}closeDrawer()}
 if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}
});
$('#locPop').addEventListener('keydown',e=>{const bs=[...e.currentTarget.querySelectorAll('button')];const i=bs.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%bs.length].focus()}if(e.key==='ArrowUp'){e.preventDefault();bs[(i-1+bs.length)%bs.length].focus()}});

/* timers */
setInterval(()=>{
 S.drop=S.drop>0?S.drop-1:8049;const h=Math.floor(S.drop/3600),m=Math.floor(S.drop%3600/60),s=S.drop%60;
 const f=v=>String(v).padStart(2,'0');const a=$('#dH');if(a){a.textContent=f(h);$('#dM').textContent=f(m);$('#dS').textContent=f(s)}
 if(cartCount()){S.slot=S.slot>0?S.slot-1:300;const t=f(Math.floor(S.slot/60))+':'+f(S.slot%60);document.querySelectorAll('.slotT').forEach(n=>n.textContent=t)}
},1000);

render();
})();
</script>
</body>
</html>
